services:
  gigaam-asr-service:
    build: .
    image: ${ASR_IMAGE:-gigaam-asr-service:local}
    init: true
    restart: unless-stopped
    gpus: all
    env_file: .env
    volumes:
      - .local/cache/huggingface:/cache/huggingface
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  export-model:
    profiles: [export]
    build:
      context: .
      target: exporter
    image: gigaam-asr-service:exporter
    volumes:
      - .local/cache/huggingface:/cache/huggingface
