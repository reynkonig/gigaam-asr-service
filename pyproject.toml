[project]
name = "gigaam-asr-service"
version = "0.1.0"
description = "OpenAI-compatible GigaAM v3 E2E RNN-T transcription service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.140.7",
    "numpy==2.5.1",
    "onnxruntime-gpu==1.23.2; sys_platform == 'linux' or sys_platform == 'win32'",
    "onnxruntime==1.23.2; sys_platform != 'linux' and sys_platform != 'win32'",
    "python-multipart==0.0.32",
    "sentencepiece==0.2.2",
    "uvicorn[standard]==0.51.0",
]

[project.scripts]
gigaam-asr-server = "gigaam_asr_service.cli:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "ruff==0.16.1",
]
cuda = [
    "onnxruntime-gpu[cuda,cudnn]==1.23.2; sys_platform == 'linux' or sys_platform == 'win32'",
]
export = [
    "hydra-core==1.3.4",
    "omegaconf==2.3.1",
    "onnx==1.19.1",
    # Transformers checks the pinned source's optional pyannote imports during export.
    "pyannote-core==6.0.1",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "transformers==4.57.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gigaam_asr_service"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
